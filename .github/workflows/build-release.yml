
name: Build aria2-next Release

on:
  push:
    paths:
      - "aria2-next/更新时间.txt"
      - "aria2-next/patch/aria2-next.patch"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aria2-next-build-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout workflow and patches
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(gh api repos/AnInsomniacy/aria2-next/releases/latest)"
          tag="$(jq -r '.tag_name' <<< "$release")"

          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "::error::Failed to get upstream release tag"
            exit 1
          fi

          version="${tag#v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Upstream release: $tag"

      - name: Checkout upstream source
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$UPSTREAM_TAG" \
            https://github.com/AnInsomniacy/aria2-next.git \
            source

      - name: Check and apply unified patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="aria2-next/patch/aria2-next.patch"

          if [[ ! -s "$PATCH" ]]; then
            echo "::error::Unified patch not found or empty: $PATCH"
            exit 1
          fi

          echo "Checking unified patch..."
          git -C source apply --check "../$PATCH"

          echo "Applying unified patch..."
          git -C source apply "../$PATCH"

          echo "Checking whitespace errors..."
          git -C source diff --check

          echo "Patch applied successfully."

      - name: Verify runner tools
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          packaging/scripts/verify-runner-tools linux

      - name: Build release
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          packaging/scripts/build-release linux

      - name: Package binary and checksum
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          BINARY="source/build/release/aria2-next"

          if [[ ! -f "$BINARY" ]]; then
            echo "::error::Build output not found: $BINARY"
            echo "Contents of source/build:"
            find source/build -maxdepth 4 -type f -print || true
            exit 1
          fi

          mkdir -p release-files

          PACKAGE="aria2-next-${VERSION}-linux-x86_64"
          install -m 0755 "$BINARY" "release-files/$PACKAGE"

          (
            cd release-files
            sha256sum "$PACKAGE" > SHA256SUMS.txt
          )

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          echo "Release files:"
          ls -lh release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria2-next-${{ steps.upstream.outputs.version }}
          name: aria2-next ${{ steps.upstream.outputs.tag }} (patched)
          body: |
            Linux x86_64 build of AnInsomniacy/aria2-next.

            Upstream release: ${{ steps.upstream.outputs.tag }}

            This build applies the unified patch:
            `aria2-next/patch/aria2-next.patch`

            The patch includes:
            - `--category-dir`
            - `--category-dir-scope`
            - `--no-proxy-list`

            Verify the downloaded binary using SHA256SUMS.txt.
          files: |
            release-files/aria2-next-*-linux-x86_64
            release-files/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: false
